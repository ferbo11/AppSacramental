{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inicio de Sesión - Parroquia El Calvario</title>

    <link rel="stylesheet"
          href="{% static 'usuarios/css/login.css' %}">
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <h1>Parroquia El Calvario</h1>

            <p>Gestión de Sacramentos</p>

            <form method="post">

                {% csrf_token %}

                <div class="form-group">
                    <label for="username">Usuario</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Ingrese su usuario"
                        required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Ingrese su contraseña"
                        required>
                </div>

                <button type="submit">
                    Iniciar sesión
                </button>

            </form>

        </div>

    </div>

</body>
</html>
