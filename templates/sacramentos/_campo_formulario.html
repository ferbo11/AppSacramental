<div class="form-field{% if campo.field.widget.input_type == 'checkbox' %} checkbox-field{% endif %}">

    {% if campo.field.widget.input_type == 'checkbox' %}

        {{ campo }}

        <label for="{{ campo.id_for_label }}">
            {{ campo.label }}
            {% if campo.field.required %}
                <span class="required-mark">*</span>
            {% endif %}
        </label>

    {% else %}

        <label for="{{ campo.id_for_label }}">
            {{ campo.label }}
            {% if campo.field.required %}
                <span class="required-mark">*</span>
            {% endif %}
        </label>

        {{ campo }}

    {% endif %}

    {% if campo.help_text %}
    <small class="help-text">
        {{ campo.help_text }}
    </small>
    {% endif %}

    {% if campo.errors %}
    <div class="field-errors">
        {{ campo.errors }}
    </div>
    {% endif %}

</div>
