{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inicio de Sesión - SacraNet</title>

    <link rel="stylesheet"
          href="{% static 'usuarios/css/login.css' %}">
</head>

<body>

    <main class="login-container">

        <!-- LOGO DE LA PARROQUIA -->
        <div class="login-logo-parroquia">
            <img
                src="{% static 'img/Calvario.png' %}"
                alt="Parroquia El Calvario, Cobán, Alta Verapaz">
        </div>

        <!-- TARJETA DE INICIO DE SESIÓN -->
        <section class="login-card">

            <header class="login-header">
                <h1>SACRANET</h1>
                <p class="login-subtitle">Parroquia El Calvario</p>
            </header>

            <form method="post">
                {% csrf_token %}

                <div class="form-group">
                    <label for="username">Usuario</label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Ingrese su usuario"
                        autocomplete="username"
                        required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Ingrese su contraseña"
                        autocomplete="current-password"
                        required>
                </div>

                <button type="submit">
                    Iniciar sesión
                </button>

            </form>

        </section>

        <!-- LOGO DE SISTEMAS UMG COBÁN -->
        <div class="login-logo-sistemas">
            <img
                src="{% static 'img/logoSistemas.png' %}"
                alt="Sistemas UMG Cobán">
        </div>

    </main>

</body>
</html>
